<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cruise Filter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a sailing board. A sticky bar holds the five everyday filters plus
   "More"; each opens a panel (dropdown on wide screens, slide-up sheet on phones).
   Active filters show as removable tags. Each sailing is one manifest row with
   hull-lettered ship name on the left and the fare block on the right. */
:root {
  --bg: #F5F6F8;
  --panel: #FFFFFF;
  --ink: #14181F;
  --muted: #5E6673;
  --line: #DCE0E6;
  --sea: #334155;
  --sea-soft: #E8ECF2;
  --buoy: #2456E6;
  --buoy-soft: #E4EBFD;
  --on-buoy: #FFFFFF;
  --display: "Big Shoulders Display", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0F1217; --panel: #181C24; --ink: #ECEFF4; --muted: #9AA3B2;
    --line: #2A303B; --sea: #B8C2D3; --sea-soft: #252B36;
    --buoy: #7C9AFF; --buoy-soft: #1B2646; --on-buoy: #0B1020;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
    --bg: #0F1217; --panel: #181C24; --ink: #ECEFF4; --muted: #9AA3B2;
    --line: #2A303B; --sea: #B8C2D3; --sea-soft: #252B36;
    --buoy: #7C9AFF; --buoy-soft: #1B2646; --on-buoy: #0B1020;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 15px/1.45 var(--body);
  font-variant-numeric: tabular-nums;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--buoy); outline-offset: 2px; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 18px 16px 48px; display: grid; gap: 16px; }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 20px; }
h1 {
  font: 800 clamp(34px, 9vw, 54px)/0.92 var(--display);
  letter-spacing: 0.02em; text-transform: uppercase; margin: 0;
}
h1 span { color: var(--buoy); }
.load { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn {
  border: 1.5px solid var(--ink); background: transparent; border-radius: 4px;
  padding: 8px 12px; font-weight: 600; cursor: pointer;
}
.btn.solid { background: var(--ink); color: var(--bg); }
.btn.quiet { border-color: var(--line); color: var(--muted); font-weight: 500; }

.notice {
  border-left: 5px solid var(--buoy); background: var(--buoy-soft);
  padding: 10px 12px; border-radius: 0 4px 4px 0; font-size: 14px;
}
.notice.real { border-color: var(--sea); background: var(--sea-soft); }
.notice b { font-weight: 700; }

.theme { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.theme select { width: auto; background: var(--panel); padding: 7px 8px; }

.wrap > * { min-width: 0; }
.barwrap { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 8px 0; margin: -8px 0; }
.bar { display: flex; gap: 8px; flex-wrap: wrap; }
.fbtn {
  display: inline-flex; flex-direction: column; align-items: flex-start; gap: 1px; flex: none;
  border: 1px solid var(--line); background: var(--panel); border-radius: 8px;
  padding: 7px 30px 7px 12px; cursor: pointer; position: relative; text-align: left; white-space: nowrap;
}
.fbtn::after { content: "\25BE"; position: absolute; right: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 12px; }
.fbtn .k { font-size: 10.5px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.fbtn .v { font-size: 14px; font-weight: 600; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
.fbtn.on { border-color: var(--buoy); background: var(--buoy-soft); }
.fbtn.on .k { color: var(--buoy); }
.fbtn[aria-expanded="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }

.backdrop { display: none; }
.sheet {
  position: absolute; top: calc(100% - 2px); left: 0; width: 360px; max-width: 100%;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18); display: flex; flex-direction: column;
  max-height: min(72vh, 600px);
}
.sheet[hidden] { display: none; }
.sheet.wide { width: 460px; }
.sheet:focus { outline: none; }
.shead {
  display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 8px;
  font: 800 19px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase;
}
.sclose { border: 0; background: none; font-size: 24px; line-height: 1; cursor: pointer; color: var(--muted); padding: 0 6px; }
.sbody { padding: 4px 14px 14px; overflow-y: auto; }
.pane { display: grid; gap: 14px; }
.pane[hidden] { display: none; }
.sfoot { display: flex; justify-content: space-between; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); }
@media (max-width: 699px) {
  .bar { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
  .bar::-webkit-scrollbar { display: none; }
  .backdrop:not([hidden]) { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 30; }
  .sheet, .sheet.wide {
    position: fixed; left: 0 !important; right: 0; bottom: 0; top: auto; width: auto; max-width: none;
    max-height: 82vh; border-radius: 14px 14px 0 0; z-index: 31;
  }
  .sfoot { padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  .sfoot .btn.solid { flex: 1; }
}

.opts { display: grid; }
.opts.scroll { max-height: 216px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; }
.opt { display: flex; align-items: center; gap: 10px; padding: 8px 2px; cursor: pointer; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.opt:last-child { border-bottom: 0; }
.opt input { width: 17px; height: 17px; accent-color: var(--buoy); margin: 0; flex: none; }
.opt .ct { margin-left: auto; color: var(--muted); font-size: 13px; }
.opt.zero { opacity: 0.45; }

.field { display: grid; gap: 6px; }
.field > label, .field > .lab { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
input[type="number"], input[type="date"], input[type="text"], input[type="search"], select {
  width: 100%; min-width: 0; padding: 8px 9px; border: 1px solid var(--line);
  border-radius: 4px; background: var(--bg);
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--bg); border-radius: 999px;
  padding: 6px 11px; font-size: 13px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--sea); border-color: var(--sea); color: var(--panel); font-weight: 600; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.check input { width: 17px; height: 17px; accent-color: var(--buoy); margin: 0; }
.hint { font-size: 12px; color: var(--muted); }

.active { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.active:empty { display: none; }
.tag {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--buoy); background: var(--buoy-soft);
  color: var(--ink); border-radius: 999px; padding: 4px 8px 4px 11px; font-size: 13px; font-weight: 600; cursor: pointer;
}
.tag span { color: var(--buoy); font-size: 16px; line-height: 1; }
.clearall { border: 0; background: none; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 13px; padding: 4px 6px; }

.summary {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 10px 18px; padding-bottom: 10px; border-bottom: 2px solid var(--ink);
}
.stats { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: baseline; }
.stat b { font: 800 30px/1 var(--display); letter-spacing: 0.02em; margin-right: 5px; }
.stat span { font-size: 13px; color: var(--muted); }
.sort { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.sort select { width: auto; background: var(--panel); }

.results { display: grid; gap: 10px; margin-top: 12px; }
.row {
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 12px 14px; display: grid; gap: 8px 16px;
  grid-template-columns: 1fr auto; align-items: start;
}
a.row.link { color: inherit; text-decoration: none; cursor: pointer; transition: border-color .12s, box-shadow .12s; }
a.row.link:hover { border-color: var(--buoy); box-shadow: 0 2px 10px rgba(0,0,0,.08); }
.go { grid-column: 1 / -1; font-size: 13px; font-weight: 700; color: var(--buoy); }
.ship { font: 800 23px/1 var(--display); letter-spacing: 0.04em; text-transform: uppercase; }
.linetag { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--sea); }
.regtag { color: var(--muted); font-weight: 600; margin-left: 6px; }
.itin { font-weight: 600; margin-top: 3px; }
.meta { font-size: 13.5px; color: var(--muted); }
.meta strong { color: var(--ink); font-weight: 600; }
.ports { grid-column: 1 / -1; font-size: 13.5px; border-top: 1px dashed var(--line); padding-top: 8px; overflow-wrap: anywhere; }
.ports em { font-style: normal; color: var(--muted); }
.fare { text-align: right; white-space: nowrap; }
.fare .pp { font: 800 28px/1 var(--display); letter-spacing: 0.02em; }
.fare .unit { font-size: 11.5px; color: var(--muted); display: block; margin-top: 2px; }
.pill {
  display: inline-block; margin-top: 6px; padding: 3px 8px; border-radius: 999px;
  background: var(--sea-soft); color: var(--sea); font-size: 12.5px; font-weight: 700;
}
.pill.best { background: var(--buoy); color: var(--on-buoy); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); background: var(--panel); border: 1px dashed var(--line); border-radius: 6px; }
.more { justify-self: center; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Cruise <span>Filter</span></h1>
    <div class="load">
      <div class="theme"><label for="palette">Colors</label>
        <select id="palette"><option value="clean">Clean</option><option value="midnight">Midnight</option><option value="tropic">Tropic</option><option value="harbor">Harbor</option></select></div>
    </div>
  </header>

  <div class="notice" id="notice"></div>

  <div class="barwrap" id="barwrap">
    <div class="bar" id="bar" role="toolbar" aria-label="Filters">
      <button type="button" class="fbtn" data-open="where" aria-expanded="false"><span class="k">Where</span><span class="v"></span></button>
      <button type="button" class="fbtn" data-open="when" aria-expanded="false"><span class="k">When</span><span class="v"></span></button>
      <button type="button" class="fbtn" data-open="nights" aria-expanded="false"><span class="k">Nights</span><span class="v"></span></button>
      <button type="button" class="fbtn" data-open="cabin" aria-expanded="false"><span class="k">Cabin</span><span class="v"></span></button>
      <button type="button" class="fbtn" data-open="price" aria-expanded="false"><span class="k">Price</span><span class="v"></span></button>
      <button type="button" class="fbtn" data-open="more" aria-expanded="false"><span class="k">More filters</span><span class="v"></span></button>
    </div>
    <div class="backdrop" id="backdrop" hidden></div>
    <div class="sheet" id="sheet" role="dialog" aria-labelledby="sheetTitle" tabindex="-1" hidden>
      <div class="shead"><span id="sheetTitle"></span><button type="button" class="sclose" id="sheetClose" aria-label="Close">&times;</button></div>
      <div class="sbody">
        <div class="pane" data-pane="where" hidden>
          <div class="opts" id="lRegion"></div>
        </div>
        <div class="pane" data-pane="when" hidden>
          <div class="pair">
            <div class="field"><label for="fFrom">Leave on or after</label><input type="date" id="fFrom"></div>
            <div class="field"><label for="fTo">Back by</label><input type="date" id="fTo"></div>
          </div>
          <div class="hint" id="windowNote"></div>
        </div>
        <div class="pane" data-pane="nights" hidden>
          <div class="chips" id="nightPresets"></div>
          <div class="pair">
            <div class="field"><label for="fNmin">At least</label><input type="number" id="fNmin" min="1" inputmode="numeric" placeholder="Any"></div>
            <div class="field"><label for="fNmax">At most</label><input type="number" id="fNmax" min="1" inputmode="numeric" placeholder="Any"></div>
          </div>
        </div>
        <div class="pane" data-pane="cabin" hidden>
          <div class="opts" id="lCabin"></div>
          <div class="hint">Prices, sorting and the price limits all switch to the cabin type you pick.</div>
        </div>
        <div class="pane" data-pane="price" hidden>
          <div class="pair">
            <div class="field"><label for="fPrice">Total, up to</label><input type="number" id="fPrice" min="0" inputmode="numeric" placeholder="$ per person"></div>
            <div class="field"><label for="fPpn">Per night, up to</label><input type="number" id="fPpn" min="0" inputmode="numeric" placeholder="$ per person"></div>
          </div>
          <label class="check" for="fPriced"><input type="checkbox" id="fPriced"> Hide sailings with no price</label>
        </div>
        <div class="pane" data-pane="more" hidden>
          <div class="field"><span class="lab">Cruise line</span><div class="opts" id="lLine"></div></div>
          <div class="field"><span class="lab">Departure port</span>
            <div class="chips"><button type="button" class="chip" id="flPorts" aria-pressed="false">Florida ports</button></div>
            <input type="search" id="fPortQ" placeholder="Search ports" aria-label="Search departure ports" autocomplete="off">
            <div class="opts scroll" id="lPort"></div></div>
          <div class="field"><label for="fShip">Ship</label><select id="fShip"></select></div>
          <div class="field"><label for="fVisit">Must visit</label>
            <input type="text" id="fVisit" placeholder="e.g. Cozumel, St. Thomas" autocomplete="off">
            <span class="hint">Separate ports with commas. All must be on the itinerary.</span></div>
          <div class="field"><label for="fSea">Max sea days</label><input type="number" id="fSea" min="0" inputmode="numeric" placeholder="Any">
            <span class="hint">Norwegian and Princess don't report sea days, so they drop out when this is set.</span></div>
          <div class="field"><span class="lab">Departs on</span><div class="chips" id="fDow"></div></div>
        </div>
      </div>
      <div class="sfoot"><button type="button" class="btn quiet" id="paneClear">Clear</button><button type="button" class="btn solid" id="paneDone">Done</button></div>
    </div>
  </div>

  <div class="active" id="active" aria-label="Active filters"></div>

    <main>
      <div class="summary">
        <div class="stats" id="stats"></div>
        <div class="sort"><label for="sortBy">Sort</label>
          <select id="sortBy">
            <option value="ppn">Lowest price per night</option>
            <option value="price">Lowest total price</option>
            <option value="date">Soonest departure</option>
            <option value="nights">Longest first</option>
          </select></div>
      </div>
      <div class="results" id="results"></div>
    </main>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var PAGE = 60;
  var CABIN = { interior: "interior", outside: "ocean view", balcony: "balcony", suite: "suite" };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function parseDay(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function isoOf(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function money(n) { return "$" + Math.round(n).toLocaleString("en-US"); }
  function store(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
  function recall(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } }


  /* ---------- state ---------- */
  var data = [], status = "loading", scrapedAt = "", shown = PAGE, lineStamps = null;
  function staleNote() {
    if (!lineStamps || !scrapedAt) return "";
    var day = scrapedAt.slice(0, 10), old = Object.keys(lineStamps).filter(function (l) { return lineStamps[l] && lineStamps[l].slice(0, 10) < day; });
    if (!old.length) return "";
    return " Older data: " + old.map(function (l) { return esc(l) + " (" + esc(lineStamps[l].slice(0, 10)) + ")"; }).join(", ") + ".";
  }
  var F = blank();
  function blank() {
    return { regions: [], lines: [], from: "", to: "", nmin: "", nmax: "", dow: [], ports: [], ship: "", visit: "", price: "", ppn: "", sea: "", priced: false, sort: "ppn", cabin: "" };
  }

  function normalize(rows) {
    return rows.filter(function (r) { return r && typeof r === "object" && r.start_date; }).map(function (r) {
      var ports = Array.isArray(r.ports) ? r.ports.map(String) : String(r.ports || "").split("|").map(function (s) { return s.trim(); }).filter(Boolean);
      var nights = Number(r.nights) || null;
      var price = Number(r.price_from) > 0 ? Number(r.price_from) : null;
      var d = parseDay(r.start_date);
      return {
        region: String(r.region || "Other"),
        url: /^https:\/\/[a-z0-9.-]+\.(royalcaribbean|celebritycruises|ncl|msccruisesusa|princess|virginvoyages)\.com\//.test(String(r.url || "")) ? String(r.url) : "",
        line: String(r.line || "Unknown line"), ship: String(r.ship || "Unknown ship"),
        itinerary: String(r.itinerary || ""), nights: nights,
        port: String(r.departure_port || "Unknown port"),
        start: String(r.start_date).slice(0, 10),
        end: r.end_date ? String(r.end_date).slice(0, 10)
          : (d && nights ? isoOf(new Date(d.getFullYear(), d.getMonth(), d.getDate() + nights)) : ""),
        dow: d ? d.getDay() : null, ports: ports,
        sea: r.sea_days == null ? null : Number(r.sea_days),
        low: price, cab: { interior: num(r.price_interior), outside: num(r.price_outside), balcony: num(r.price_balcony), suite: num(r.price_suite) },
        price: price, ppn: price && nights ? price / nights : null
      };
    });
  }
  function num(v) { return Number(v) > 0 ? Number(v) : null; }
  function applyCabin() {
    data.forEach(function (r) {
      r.price = F.cabin ? r.cab[F.cabin] : r.low;
      r.ppn = r.price && r.nights ? r.price / r.nights : null;
    });
  }

  function setData(rows, stamp) {
    data = normalize(rows); status = "ready"; scrapedAt = stamp || "";
    F.lines = F.lines.filter(function (v) { return has("line", v); });
    F.regions = F.regions.filter(function (v) { return has("region", v); });
    F.ports = F.ports.filter(function (v) { return has("port", v); });
    if (F.ship && !has("ship", F.ship)) F.ship = "";
    applyCabin(); buildOptions(); syncInputs(); render();
  }
  function has(key, v) { return data.some(function (r) { return r[key] === v; }); }
  function counts(key) {
    var m = {};
    data.forEach(function (r) { m[r[key]] = (m[r[key]] || 0) + 1; });
    return Object.keys(m).sort(function (a, b) { return m[b] - m[a] || a.localeCompare(b); });
  }

  /* ---------- controls ---------- */
  var order = { region: [], line: [], port: [] };
  var CABS = [["", "Cheapest available"], ["interior", "Interior"], ["outside", "Ocean view"], ["balcony", "Balcony"], ["suite", "Suite"]];
  var NIGHTS = [["2", "5", "2–5 nights"], ["6", "8", "6–8 nights"], ["9", "", "9+ nights"]];
  var FLORIDA = ["Miami", "Fort Lauderdale", "Port Canaveral", "Tampa", "Jacksonville"];
  var PANES = {
    where: { title: "Part of the world", keys: ["regions"] },
    when: { title: "Travel dates", keys: ["from", "to"] },
    nights: { title: "Nights", keys: ["nmin", "nmax"] },
    cabin: { title: "Cabin type", keys: ["cabin"] },
    price: { title: "Max price per person", keys: ["price", "ppn", "priced"] },
    more: { title: "More filters", keys: ["lines", "ports", "ship", "visit", "sea", "dow"] }
  };
  var openPane = null, opener = null, activeFns = [];

  function chipSet(el, values, labels, selected) {
    el.innerHTML = values.map(function (v, i) {
      return '<button type="button" class="chip" data-v="' + esc(v) + '" aria-pressed="' + (selected.indexOf(v) >= 0) + '">' + esc(labels ? labels[i] : v) + "</button>";
    }).join("");
  }
  function buildOptions() {
    order = { region: counts("region"), line: counts("line"), port: counts("port") };
    chipSet($("fDow"), [0, 1, 2, 3, 4, 5, 6], DOW, F.dow);
    $("nightPresets").innerHTML = NIGHTS.map(function (n, i) { return '<button type="button" class="chip" data-i="' + i + '">' + n[2] + "</button>"; }).join("");
    var ships = counts("ship").sort();
    $("fShip").innerHTML = '<option value="">Any ship</option>' + ships.map(function (s) {
      return '<option value="' + esc(s) + '">' + esc(s) + "</option>";
    }).join("");
  }
  function syncInputs() {
    $("fFrom").value = F.from; $("fTo").value = F.to; $("fNmin").value = F.nmin; $("fNmax").value = F.nmax;
    $("fShip").value = F.ship; $("fVisit").value = F.visit; $("fPrice").value = F.price; $("fPpn").value = F.ppn;
    $("fSea").value = F.sea; $("fPriced").checked = F.priced; $("sortBy").value = F.sort;
    chipSet($("fDow"), [0, 1, 2, 3, 4, 5, 6], DOW, F.dow);
  }
  function toggle(list, v) { var i = list.indexOf(v); if (i >= 0) list.splice(i, 1); else list.push(v); }
  function wireInput(id, key, prop) {
    $(id).addEventListener("input", function () { F[key] = prop ? $(id)[prop] : $(id).value; changed(); });
  }
  function changed() { shown = PAGE; store("cruiseFilter.filters", F); render(); }
  function isSet(k) { return Array.isArray(F[k]) ? F[k].length > 0 : (F[k] !== "" && F[k] !== false); }
  function clearKeys(keys) {
    var b = blank();
    keys.forEach(function (k) { F[k] = b[k]; });
    applyCabin(); syncInputs(); changed();
  }

  /* how many sailings each choice would give, with every other filter applied */
  function facet(key, prop) {
    var m = {};
    data.forEach(function (r) { if (matches(r, key)) m[r[prop]] = (m[r[prop]] || 0) + 1; });
    return m;
  }
  function optList(el, key, prop, query) {
    var f = facet(key, prop), q = (query || "").trim().toLowerCase();
    var vals = order[prop].filter(function (v) { return !q || v.toLowerCase().indexOf(q) >= 0; });
    el.innerHTML = vals.map(function (v) {
      var c = f[v] || 0, on = F[key].indexOf(v) >= 0;
      return '<label class="opt' + (c || on ? "" : " zero") + '"><input type="checkbox" data-k="' + key + '" data-v="' + esc(v) + '"' + (on ? " checked" : "") +
        "><span>" + esc(v) + '</span><span class="ct">' + c.toLocaleString("en-US") + "</span></label>";
    }).join("") || '<div class="hint" style="padding:8px 2px">Nothing matches that search.</div>';
  }
  function renderPane() {
    if (!openPane) return;
    var a = document.activeElement, fk = a && a.dataset ? a.dataset.k : null, fv = a && a.dataset ? a.dataset.v : null;
    if (openPane === "where") optList($("lRegion"), "regions", "region");
    if (openPane === "more") {
      optList($("lLine"), "lines", "line");
      optList($("lPort"), "ports", "port", $("fPortQ").value);
      var fl = FLORIDA.filter(function (p) { return order.port.indexOf(p) >= 0; });
      $("flPorts").setAttribute("aria-pressed", String(fl.length > 0 && fl.every(function (p) { return F.ports.indexOf(p) >= 0; })));
    }
    if (openPane === "cabin") {
      $("lCabin").innerHTML = CABS.map(function (c) {
        return '<label class="opt"><input type="radio" name="cabin" data-k="cabin" data-v="' + c[0] + '"' + (F.cabin === c[0] ? " checked" : "") + "><span>" + c[1] + "</span></label>";
      }).join("");
    }
    if (openPane === "nights") {
      Array.prototype.forEach.call($("nightPresets").children, function (b, i) {
        b.setAttribute("aria-pressed", String(String(F.nmin) === NIGHTS[i][0] && String(F.nmax) === NIGHTS[i][1]));
      });
    }
    if (fk) {
      var again = Array.prototype.filter.call($("sheet").querySelectorAll("input[data-k]"), function (i) { return i.dataset.k === fk && i.dataset.v === fv; })[0];
      if (again) again.focus();
    }
  }

  function openSheet(name, btn) {
    if (openPane === name) { closeSheet(); return; }
    openPane = name; opener = btn;
    Array.prototype.forEach.call(document.querySelectorAll(".pane"), function (p) { p.hidden = p.dataset.pane !== name; });
    Array.prototype.forEach.call(document.querySelectorAll(".fbtn"), function (b) { b.setAttribute("aria-expanded", String(b === btn)); });
    $("sheetTitle").textContent = PANES[name].title;
    var sheet = $("sheet"), w = name === "more" ? 460 : 360;
    sheet.classList.toggle("wide", name === "more");
    sheet.style.left = Math.max(0, Math.min(btn.offsetLeft - $("bar").scrollLeft, $("barwrap").clientWidth - w)) + "px";
    sheet.hidden = false; $("backdrop").hidden = false;
    $("fPortQ").value = "";
    renderPane();
    sheet.querySelector(".sbody").scrollTop = 0;
    sheet.focus();
  }
  function closeSheet(refocus) {
    if (!openPane) return;
    openPane = null;
    $("sheet").hidden = true; $("backdrop").hidden = true;
    Array.prototype.forEach.call(document.querySelectorAll(".fbtn"), function (b) { b.setAttribute("aria-expanded", "false"); });
    if (refocus && opener) opener.focus();
  }

  /* ---------- labels for the bar and the active-filter tags ---------- */
  function shortDay(iso) {
    var d = parseDay(iso); if (!d) return "";
    return MON[d.getMonth()] + " " + d.getDate() + (d.getFullYear() !== new Date().getFullYear() ? ", " + d.getFullYear() : "");
  }
  function nightsLabel() {
    var a = F.nmin, b = F.nmax;
    if (a !== "" && b !== "") return String(a) === String(b) ? a + " nights" : a + "–" + b + " nights";
    if (a !== "") return a + "+ nights";
    if (b !== "") return "Up to " + b + " nights";
    return "";
  }
  function cabinLabel() { return CABS.filter(function (c) { return c[0] === F.cabin; })[0][1]; }
  function updateBar() {
    var v = {
      where: F.regions.length ? F.regions[0] + (F.regions.length > 1 ? " +" + (F.regions.length - 1) : "") : "Anywhere",
      when: F.from && F.to ? shortDay(F.from) + " – " + shortDay(F.to) : F.from ? "From " + shortDay(F.from) : F.to ? "Back by " + shortDay(F.to) : "Any dates",
      nights: nightsLabel() || "Any length",
      cabin: F.cabin ? cabinLabel() : "Cheapest",
      price: [F.price !== "" ? "$" + Number(F.price).toLocaleString("en-US") : "", F.ppn !== "" ? "$" + F.ppn + "/night" : ""].filter(Boolean).join(", ") || (F.priced ? "Priced only" : "Any price"),
      more: (function () { var n = PANES.more.keys.filter(isSet).length; return n ? n + " active" : "Line, port, ship"; })()
    };
    Array.prototype.forEach.call(document.querySelectorAll(".fbtn"), function (b) {
      var name = b.dataset.open;
      b.querySelector(".v").textContent = (name === "price" && (F.price !== "" || F.ppn !== "") ? "Up to " : "") + v[name];
      b.classList.toggle("on", PANES[name].keys.some(isSet));
    });
  }
  function renderActive() {
    var tags = [];
    function drop(key, v) { return function () { toggle(F[key], v); }; }
    function wipe(keys) { return function () { var b = blank(); keys.forEach(function (k) { F[k] = b[k]; }); }; }
    F.regions.forEach(function (v) { tags.push([v, drop("regions", v)]); });
    if (F.from) tags.push(["From " + shortDay(F.from), wipe(["from"])]);
    if (F.to) tags.push(["Back by " + shortDay(F.to), wipe(["to"])]);
    if (nightsLabel()) tags.push([nightsLabel(), wipe(["nmin", "nmax"])]);
    if (F.cabin) tags.push([cabinLabel(), wipe(["cabin"])]);
    if (F.price !== "") tags.push(["Up to $" + Number(F.price).toLocaleString("en-US"), wipe(["price"])]);
    if (F.ppn !== "") tags.push(["Up to $" + F.ppn + "/night", wipe(["ppn"])]);
    if (F.priced) tags.push(["Priced only", wipe(["priced"])]);
    F.lines.forEach(function (v) { tags.push([v, drop("lines", v)]); });
    if (F.ports.length > 3) tags.push([F.ports.length + " departure ports", wipe(["ports"])]);
    else F.ports.forEach(function (v) { tags.push(["From " + v, drop("ports", v)]); });
    if (F.ship) tags.push([F.ship, wipe(["ship"])]);
    if (F.visit.trim()) tags.push(["Visits " + F.visit.trim(), wipe(["visit"])]);
    if (F.sea !== "") tags.push(["Max " + F.sea + " sea day" + (String(F.sea) === "1" ? "" : "s"), wipe(["sea"])]);
    if (F.dow.length) tags.push(["Departs " + F.dow.slice().sort().map(function (d) { return DOW[d]; }).join(", "), wipe(["dow"])]);
    activeFns = tags.map(function (t) { return t[1]; });
    $("active").innerHTML = tags.map(function (t, i) {
      return '<button type="button" class="tag" data-i="' + i + '" aria-label="Remove filter: ' + esc(t[0]) + '">' + esc(t[0]) + '<span aria-hidden="true">&times;</span></button>';
    }).join("") + (tags.length ? '<button type="button" class="clearall" id="clearAll">Clear all</button>' : "");
  }

  /* ---------- filtering ---------- */
  function matches(r, skip) {
    if (skip !== "regions" && F.regions.length && F.regions.indexOf(r.region) < 0) return false;
    if (skip !== "lines" && F.lines.length && F.lines.indexOf(r.line) < 0) return false;
    if (skip !== "ports" && F.ports.length && F.ports.indexOf(r.port) < 0) return false;
    if (F.dow.length && F.dow.indexOf(r.dow) < 0) return false;
    if (F.ship && r.ship !== F.ship) return false;
    if (F.from && r.start < F.from) return false;
    if (F.to && (r.end || r.start) > F.to) return false;
    if (F.nmin !== "" && (r.nights == null || r.nights < +F.nmin)) return false;
    if (F.nmax !== "" && (r.nights == null || r.nights > +F.nmax)) return false;
    if (F.sea !== "" && (r.sea == null || r.sea > +F.sea)) return false;
    if (F.priced && r.price == null) return false;
    if (F.price !== "" && (r.price == null || r.price > +F.price)) return false;
    if (F.ppn !== "" && (r.ppn == null || r.ppn > +F.ppn)) return false;
    if (F.visit.trim()) {
      var hay = r.ports.join(" | ").toLowerCase();
      var want = F.visit.toLowerCase().split(",").map(function (s) { return s.trim(); }).filter(Boolean);
      for (var i = 0; i < want.length; i++) if (hay.indexOf(want[i]) < 0) return false;
    }
    return true;
  }
  function sorter(a, b) {
    var big = 1e12;
    if (F.sort === "price") return (a.price == null ? big : a.price) - (b.price == null ? big : b.price) || a.start.localeCompare(b.start);
    if (F.sort === "date") return a.start.localeCompare(b.start) || (a.price || big) - (b.price || big);
    if (F.sort === "nights") return (b.nights || 0) - (a.nights || 0) || a.start.localeCompare(b.start);
    return (a.ppn == null ? big : a.ppn) - (b.ppn == null ? big : b.ppn) || a.start.localeCompare(b.start);
  }

  /* ---------- render ---------- */
  function dateRange(r) {
    var s = parseDay(r.start), e = parseDay(r.end);
    if (!s) return esc(r.start);
    var out = DOW[s.getDay()] + ", " + MON[s.getMonth()] + " " + s.getDate() + ", " + s.getFullYear();
    if (e) out += " to " + MON[e.getMonth()] + " " + e.getDate();
    return out;
  }
  function render() {
    var list = data.filter(function (r) { return matches(r); }).sort(sorter);
    var priced = list.filter(function (r) { return r.price != null; });
    var lowP = priced.reduce(function (m, r) { return Math.min(m, r.price); }, Infinity);
    var lowN = priced.reduce(function (m, r) { return r.ppn != null ? Math.min(m, r.ppn) : m; }, Infinity);

    $("notice").className = "notice" + (status === "ready" ? " real" : "");
    $("notice").innerHTML = status === "loading" ? "Loading sailings\u2026"
      : status === "error" ? "<b>Couldn't load the sailings data.</b> Check your connection and reload the page."
      : "<b>" + data.length.toLocaleString("en-US") + " sailings loaded</b>" + (scrapedAt ? ", pulled " + esc(scrapedAt.replace("T", " at ")) : "") + ". Prices are per person for two sharing a cabin, including taxes, fees and port expenses, as of that pull. Daily gratuities are extra on every line." + staleNote();

    var wf = parseDay(F.from), wt = parseDay(F.to), note = "Shows only cruises that leave and return inside these dates.";
    if (wf && wt) {
      var span = Math.round((wt - wf) / 86400000);
      note = span < 0 ? "The return date is before the leave date." : "A " + span + "-night window. Only cruises that leave and return inside it are shown.";
    }
    $("windowNote").textContent = note;
    updateBar(); renderActive(); renderPane();
    $("paneDone").textContent = status === "ready" ? "Show " + list.length.toLocaleString("en-US") + " sailing" + (list.length === 1 ? "" : "s") : "Done";
    $("stats").innerHTML =
      '<div class="stat"><b>' + list.length.toLocaleString("en-US") + "</b><span>of " + data.length.toLocaleString("en-US") + " sailings match</span></div>" +
      (priced.length ? '<div class="stat"><b>' + money(lowP) + "</b><span>lowest fare</span></div>" +
        '<div class="stat"><b>' + money(lowN) + "</b><span>lowest per night</span></div>" : "");

    if (!list.length) {
      $("results").innerHTML = status === "ready" ? '<div class="empty">No sailings match these filters. Remove one of the tags above to widen the search.</div>' : "";
      return;
    }
    var html = list.slice(0, shown).map(function (r) {
      var best = r.ppn != null && r.ppn === lowN;
      var fare = r.price != null
        ? '<div class="pp">' + money(r.price) + '</div><span class="unit">' + (F.cabin ? "per person, " + CABIN[F.cabin] : "per person from") + "</span>" +
          (r.ppn != null ? '<span class="pill' + (best ? " best" : "") + '">' + money(r.ppn) + " / night</span>" : "")
        : '<span class="unit">' + (F.cabin ? "No " + CABIN[F.cabin] + " price" : "No price listed") + "</span>";
      var sea = r.sea == null ? "" : " · <strong>" + r.sea + "</strong> sea day" + (r.sea === 1 ? "" : "s");
      var open = r.url ? '<a class="row link" href="' + esc(r.url) + '" target="_blank" rel="noopener noreferrer" aria-label="' + esc("Open " + r.ship + ", " + r.start + ", on the " + r.line + " site") + '">' : '<article class="row">';
      return open + '<div>' +
        '<div class="linetag">' + esc(r.line) + (r.region !== "Other" ? ' <span class="regtag">' + esc(r.region) + "</span>" : "") + "</div>" +
        '<div class="ship">' + esc(r.ship) + "</div>" +
        '<div class="itin">' + esc(r.itinerary) + "</div>" +
        '<div class="meta">' + dateRange(r) + "</div>" +
        '<div class="meta">From <strong>' + esc(r.port) + "</strong>" + (r.nights ? " · <strong>" + r.nights + "</strong> nights" : "") + sea + "</div>" +
        '</div><div class="fare">' + fare + "</div>" +
        (r.ports.length ? '<div class="ports"><em>Visits</em> ' + r.ports.map(esc).join(" · ") + "</div>" : "") +
        (r.url ? '<div class="go">View on ' + esc(r.line) + " \u2197</div></a>" : "</article>");
    }).join("");
    if (list.length > shown) html += '<button type="button" class="btn more" id="more">Show ' + Math.min(PAGE, list.length - shown) + " more</button>";
    $("results").innerHTML = html;
  }


  /* ---------- color palettes ---------- */
  var KEYS = ["bg", "panel", "ink", "muted", "line", "sea", "sea-soft", "buoy", "buoy-soft", "on-buoy"];
  var PAL = {
    clean: null,
    midnight: { dark: ["#0A1024", "#121A36", "#EEF1FA", "#98A2C4", "#263058", "#7FB2FF", "#1A2750", "#F2B84B", "#3A2E12", "#1A1304"] },
    tropic: { light: ["#F3F8F6", "#FFFFFF", "#10231E", "#55706A", "#D3E2DD", "#0B7A63", "#DAF0EA", "#D93A62", "#FCE3E9", "#FFFFFF"],
              dark: ["#0A1714", "#11231F", "#E6F2EE", "#8FAAA3", "#23403A", "#4FC9AE", "#143830", "#FF7090", "#40182A", "#2A0812"] },
    harbor: { light: ["#EEF3F4", "#FFFFFF", "#0F2430", "#5A6F7A", "#D2DDE1", "#17717B", "#DCEEF0", "#D9481F", "#FBE6DF", "#FFFFFF"],
              dark: ["#0B171E", "#12232D", "#E7EFF2", "#93A8B2", "#25404D", "#63BEC7", "#173A42", "#FF7B52", "#44201A", "#2A0D04"] }
  };
  var palette = "clean", mq = window.matchMedia("(prefers-color-scheme: dark)");
  function applyPalette() {
    var root = document.documentElement, p = PAL[palette], t = root.getAttribute("data-theme");
    var dark = t ? t === "dark" : mq.matches;
    var vals = p ? (p.light ? (dark ? p.dark : p.light) : p.dark) : null;
    KEYS.forEach(function (k, i) { if (vals) root.style.setProperty("--" + k, vals[i]); else root.style.removeProperty("--" + k); });
    root.style.colorScheme = vals ? (p.light && !dark ? "light" : "dark") : "";
  }
  var sp = recall("cruiseFilter.palette"); if (typeof sp === "string" && sp in PAL) palette = sp;
  $("palette").value = palette; applyPalette();
  $("palette").addEventListener("change", function () { palette = $("palette").value; store("cruiseFilter.palette", palette); applyPalette(); });
  if (mq.addEventListener) mq.addEventListener("change", applyPalette);
  new MutationObserver(applyPalette).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  /* ---------- wire up ---------- */
  [["fFrom", "from"], ["fTo", "to"], ["fNmin", "nmin"], ["fNmax", "nmax"], ["fShip", "ship"], ["fVisit", "visit"],
   ["fPrice", "price"], ["fPpn", "ppn"], ["fSea", "sea"], ["sortBy", "sort"]].forEach(function (p) { wireInput(p[0], p[1]); });
  wireInput("fPriced", "priced", "checked");
  $("bar").addEventListener("click", function (e) { var b = e.target.closest(".fbtn"); if (b) openSheet(b.dataset.open, b); });
  $("sheet").addEventListener("change", function (e) {
    var t = e.target; if (!t.dataset || !t.dataset.k) return;
    if (t.dataset.k === "cabin") { F.cabin = t.dataset.v; applyCabin(); } else toggle(F[t.dataset.k], t.dataset.v);
    changed();
  });
  $("fDow").addEventListener("click", function (e) {
    var b = e.target.closest(".chip"); if (!b) return;
    toggle(F.dow, Number(b.dataset.v)); b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true")); changed();
  });
  $("nightPresets").addEventListener("click", function (e) {
    var b = e.target.closest(".chip"); if (!b) return;
    var n = NIGHTS[+b.dataset.i], on = b.getAttribute("aria-pressed") === "true";
    F.nmin = on ? "" : n[0]; F.nmax = on ? "" : n[1]; syncInputs(); changed();
  });
  $("flPorts").addEventListener("click", function () {
    var fl = FLORIDA.filter(function (p) { return order.port.indexOf(p) >= 0; }), on = $("flPorts").getAttribute("aria-pressed") === "true";
    F.ports = F.ports.filter(function (p) { return fl.indexOf(p) < 0; });
    if (!on) F.ports = F.ports.concat(fl);
    changed();
  });
  $("fPortQ").addEventListener("input", renderPane);
  $("paneClear").addEventListener("click", function () { if (openPane) clearKeys(PANES[openPane].keys); });
  $("paneDone").addEventListener("click", function () { closeSheet(true); });
  $("sheetClose").addEventListener("click", function () { closeSheet(true); });
  $("backdrop").addEventListener("click", function () { closeSheet(); });
  document.addEventListener("mousedown", function (e) {
    if (openPane && !$("sheet").contains(e.target) && !e.target.closest(".fbtn")) closeSheet();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && openPane) closeSheet(true); });
  $("active").addEventListener("click", function (e) {
    if (e.target.id === "clearAll") { var s = F.sort; F = blank(); F.sort = s; applyCabin(); syncInputs(); changed(); return; }
    var t = e.target.closest(".tag"); if (!t) return;
    activeFns[+t.dataset.i](); applyCabin(); syncInputs(); changed();
  });
  $("results").addEventListener("click", function (e) { if (e.target.id === "more") { shown += PAGE; render(); } });

  var savedF = recall("cruiseFilter.filters");
  if (savedF && typeof savedF === "object") {
    var b = blank();
    Object.keys(b).forEach(function (k) {
      if (savedF[k] != null && Array.isArray(savedF[k]) === Array.isArray(b[k]) && typeof savedF[k] === typeof b[k]) F[k] = savedF[k];
    });
  }
  try { localStorage.removeItem("cruiseFilter.data"); } catch (e) {}  // leftover from the old file loader
  buildOptions(); syncInputs(); render();
  fetch("sailings.json", { cache: "no-cache" }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (j) {
    var rows = Array.isArray(j) ? j : j.sailings;
    if (!Array.isArray(rows) || !rows.length) throw 0;
    lineStamps = j.lines && typeof j.lines === "object" ? j.lines : null;
    setData(rows, String(j.scraped_at || ""));
  }).catch(function () { status = "error"; render(); });
})();
</script>
</body>
