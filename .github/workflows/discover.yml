name: Discover
on:
  workflow_dispatch:
  push:
    paths: ["scripts/discover.py", ".github/workflows/discover.yml"]
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright && python3 -m playwright install --with-deps chromium >/dev/null
      - run: python3 scripts/discover.py
